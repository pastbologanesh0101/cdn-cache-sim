[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cdnsim"
version = "0.1.0"
description = "A trace-driven CDN cache-hierarchy simulator: Zipf workloads, consistent-hash sharding, LRU/LFU/FIFO/S3-FIFO, edge+regional+origin tiers, hit-ratio and latency analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishwanathan Tamizharasan" }]
keywords = ["cdn", "caching", "simulation", "consistent-hashing", "lru", "s3-fifo", "zipf", "networking", "systems"]

[project.scripts]
cdnsim = "cdnsim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["cdnsim"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
